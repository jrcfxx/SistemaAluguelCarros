micronaut:
  application:
    name: sistemaaluguelcarros

server:
  port: ${SERVER_PORT:8080}

datasources:
  default:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=false;loginTimeout=30;
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    dialect: SQL_SERVER
    schema-generate: NONE

# Desenvolvimento: hbm2ddl.auto=update cria/atualiza tabelas automaticamente.
# Produção: defina DB_HBM2DDL_AUTO=none
jpa:
  default:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        default_schema: ${DB_SCHEMA:dbo}
        hbm2ddl:
          auto: ${DB_HBM2DDL_AUTO:update}
