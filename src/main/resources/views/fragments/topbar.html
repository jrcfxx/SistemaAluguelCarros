<nav th:fragment="topbar" xmlns:th="http://www.thymeleaf.org" class="topbar" aria-label="Navegação principal">

    <a class="brand-mark" href="/">
        <img src="/img/autodrive-logo.svg" alt="AutoDrive" class="brand-logo">
    </a>

    <!-- Links de navegação (centro) -->
    <div class="topbar-links">
        <a class="topbar-link" href="/catalogo">Catálogo</a>

        <th:block th:if="${autenticado}">
            <a class="topbar-link" href="/pedidos">Meus pedidos</a>
            <a class="topbar-link" th:href="@{/clientes/{cid}/rendimentos(cid=${clienteId})}">Rendimentos</a>
            <a class="topbar-link" href="/clientes">Cadastro</a>
        </th:block>

        <th:block th:if="${agenteAutenticado}">
            <a class="topbar-link" href="/agente/pedidos">Pedidos</a>
            <a class="topbar-link" href="/agente/automoveis">Frota</a>
        </th:block>
    </div>

    <!-- Ações (direita) -->
    <div class="topbar-actions">

        <!-- Cliente autenticado -->
        <th:block th:if="${autenticado}">
            <span class="user-chip" th:text="${clienteNome}">Nome</span>
            <a class="button button-primary-solid" href="/pedidos/novo">Novo pedido</a>
            <form method="post" action="/logout" class="inline-form">
                <button class="button button-neutral" type="submit">Sair</button>
            </form>
        </th:block>

        <!-- Agente autenticado -->
        <th:block th:if="${agenteAutenticado}">
            <span class="user-chip" th:text="|Agente · ${agenteNome}|">Agente</span>
            <form method="post" action="/agente/logout" class="inline-form">
                <button class="button button-neutral" type="submit">Sair</button>
            </form>
        </th:block>

        <!-- Visitante -->
        <th:block th:if="${!autenticado and !agenteAutenticado}">
            <a class="topbar-link topbar-link-muted" href="/agente/login">Área do agente</a>
            <a class="button button-ghost" href="/login">Entrar</a>
            <a class="button button-primary-solid" href="/clientes/novo">Criar conta</a>
        </th:block>

    </div>
</nav>
