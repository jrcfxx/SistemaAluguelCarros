<!DOCTYPE html>
<html th:fragment="layout(title, content, scripts)" lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<main class="page-wrap">
    <th:block th:replace="${content}"></th:block>
</main>
<th:block th:if="${scripts != null}">
    <th:block th:replace="${scripts}"></th:block>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html th:fragment="layout-full(title, content, scripts)" lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<th:block th:replace="${content}"></th:block>
<th:block th:if="${scripts != null}">
    <th:block th:replace="${scripts}"></th:block>
</th:block>
</body>
</html>
