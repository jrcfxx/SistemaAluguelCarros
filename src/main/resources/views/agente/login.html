<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout('Login do agente', ~{::content}, null)}">
    <th:block th:fragment="content">
    <div th:replace="~{fragments/page-header :: pageHeader(
            'Login do agente',
            'Acesso à fila de análise de pedidos e gestão de frota.',
            null,
            null
        )}"></div>

    <section class="panel">
        <div th:replace="~{fragments/flash :: flash}"></div>

        <form method="post" action="/agente/login" enctype="application/x-www-form-urlencoded">
            <div class="grid">
                <div class="field field-full">
                    <label for="username">Usuário</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>
                <div class="field field-full">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
                </div>
            </div>

            <div class="actions">
                <button class="button button-primary-solid" type="submit">Entrar como agente</button>
            </div>
        </form>
    </section>
    </th:block>
</th:block>
</html>
