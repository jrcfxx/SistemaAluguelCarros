<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout(${tituloPagina}, ~{::content}, null)}">
    <th:block th:fragment="content">
    <section class="hero">
        <span class="eyebrow">• Contrato de locação</span>
        <h1 th:text="${contrato.numeroContrato}">CTR-1</h1>
        <p>
            Documento gerado em
            <strong th:text="${#temporals.format(contrato.dataGeracao, 'dd/MM/yyyy HH:mm')}">01/01/2026</strong>
            referente ao pedido nº <strong th:text="${pedido.id}">1</strong>
            (status do pedido: <span th:text="${pedido.status}">APROVADO</span>).
            Tipo de contrato: <strong th:text="${contrato.tipoContrato.tituloAmigavel}">Locação simples</strong>.
        </p>
        <div class="hero-actions">
            <a class="button button-primary" th:href="${voltarUrl}">Voltar</a>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <div>
                <h2>Termos</h2>
                <p th:text="|Cliente: ${cliente.nome} • CPF: ${cliente.cpf}|">Cliente</p>
            </div>
        </div>
        <div class="field-full">
            <pre class="contrato-termos" th:text="${contrato.termos}">Texto do contrato</pre>
        </div>
    </section>
    </th:block>
</th:block>
</html>
