<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout('Início', ~{::content}, null)}">
    <th:block th:fragment="content">
    <section class="hero">
        <span class="eyebrow">• Bem-vindo</span>
        <h1>Gestão de aluguel de carros</h1>
        <p>
            Cadastre-se para utilizar o sistema. Após o cadastro, faça login com seu CPF e senha
            para acessar a área de clientes.
        </p>
        <div class="hero-actions">
            <a class="button button-primary" href="/clientes/novo" th:if="${!autenticado}">Criar conta</a>
            <a class="button button-primary" href="/clientes" th:if="${autenticado}">Ver meu cadastro</a>
            <a class="button button-secondary" href="/pedidos" th:if="${autenticado}">Meus pedidos</a>
            <a class="button button-secondary" href="/pedidos/novo" th:if="${autenticado}">Novo pedido</a>
            <a class="button button-secondary" th:href="@{/clientes/{cid}/rendimentos(cid=${clienteId})}" th:if="${autenticado}">Meus rendimentos</a>
            <a class="button button-secondary" href="/login" th:if="${!autenticado}">Entrar</a>
            <a class="button button-secondary" href="/agente/pedidos" th:if="${agenteAutenticado}">Painel do agente</a>
            <a class="button button-secondary" href="/agente/automoveis" th:if="${agenteAutenticado}">Frota (automóveis)</a>
            <a class="button button-secondary" href="/agente/login" th:if="${!agenteAutenticado}">Área do agente</a>
        </div>
    </section>
    </th:block>
</th:block>
</html>
