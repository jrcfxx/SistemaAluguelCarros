<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | Sistema de Aluguel de Carros'">Cadastro de cliente</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container">
    <div class="topbar">
        <a class="brand-mark" href="/clientes">
            <span class="brand-dot"></span>
            <span>Sistema de Aluguel de Carros</span>
        </a>
    </div>

    <section class="hero">
        <span class="eyebrow">• Cliente</span>
        <h1 th:text="${titulo}">Cadastrar cliente</h1>
        <p>
            Preencha os dados básicos do cliente.
            O sistema já bloqueia CPFs duplicados.
        </p>
    </section>

    <section class="panel">
        <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>

        <form method="post" th:action="${formAction}" enctype="application/x-www-form-urlencoded">
            <div class="grid">
                <div>
                    <label for="nome">Nome *</label>
                    <input id="nome" name="nome" type="text" th:value="${cliente.nome}" required>
                </div>

                <div>
                    <label for="cpf">CPF *</label>
                    <input id="cpf" name="cpf" type="text" th:value="${cliente.cpf}" required>
                    <div class="hint">O CPF deve ser único no sistema.</div>
                </div>

                <div>
                    <label for="rg">RG</label>
                    <input id="rg" name="rg" type="text" th:value="${cliente.rg}">
                </div>

                <div>
                    <label for="profissao">Profissão</label>
                    <input id="profissao" name="profissao" type="text" th:value="${cliente.profissao}">
                </div>

                <div class="field-full">
                    <label for="endereco">Endereço *</label>
                    <input id="endereco" name="endereco" type="text" th:value="${cliente.endereco}" required>
                </div>
            </div>

            <div class="actions">
                <a class="button button-neutral" href="/clientes">Cancelar</a>
                <button class="button button-primary-solid" type="submit">Salvar cliente</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
